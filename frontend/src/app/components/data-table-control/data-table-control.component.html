<div class="data-table-container">
  <label *ngIf="def.label" class="block text-sm font-medium text-gray-700 mb-1" [ngClass]="{'text-red-500': !isValid && touched}">
    {{ def.label }} <span *ngIf="isRequired()" class="text-red-500">*</span>
  </label>

  <div class="overflow-x-auto border border-gray-300 rounded-md">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th *ngFor="let col of columns" scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            {{ col.label }}
          </th>
          <th scope="col" class="relative px-6 py-3">
            <span class="sr-only">Actions</span>
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let row of rows; let i = index">
          <td *ngFor="let col of columns" class="px-6 py-4 whitespace-nowrap">
            <!-- Render specific input based on col.type -->
            <input *ngIf="col.type === 'text'" type="text" [value]="row[col.id]" (input)="onCellChange(i, col.id, $any($event.target).value)" class="focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md" [disabled]="def.disabled || def.readonly" />

            <input *ngIf="col.type === 'number'" type="number" [value]="row[col.id]" (input)="onCellChange(i, col.id, $any($event.target).value)" class="focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md" [disabled]="def.disabled || def.readonly" />

            <input *ngIf="col.type === 'checkbox'" type="checkbox" [checked]="row[col.id]" (change)="onCellChange(i, col.id, $any($event.target).checked)" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300 rounded" [disabled]="def.disabled || def.readonly" />

            <select *ngIf="col.type === 'combobox'" [value]="row[col.id]" (change)="onCellChange(i, col.id, $any($event.target).value)" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" [disabled]="def.disabled || def.readonly">
              <option *ngFor="let opt of col.options" [value]="opt.value">{{ opt.label }}</option>
            </select>

            <span *ngIf="!['text', 'number', 'checkbox', 'combobox'].includes(col.type)">Unsupported: {{col.type}}</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button type="button" (click)="removeRow(i)" class="text-red-600 hover:text-red-900" [disabled]="def.disabled || def.readonly">Delete</button>
          </td>
        </tr>
        <tr *ngIf="rows.length === 0">
          <td [attr.colspan]="columns.length + 1" class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
            No rows added yet.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-2 flex justify-start">
    <button type="button" (click)="addRow()" class="inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" [disabled]="def.disabled || def.readonly">
      Add Row
    </button>
  </div>

  <div *ngIf="!isValid && touched" class="mt-1 text-sm text-red-600">
    <div *ngFor="let error of errors">{{ error }}</div>
  </div>
</div>
