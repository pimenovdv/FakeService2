<div class="dynamic-field-container" [@fadeSlideInOut] [ngSwitch]="componentDef.type" *ngIf="!isHidden" [title]="componentDef.tooltip || null">
  <app-text-input *ngSwitchCase="'text'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-text-input>
  <app-combobox-control *ngSwitchCase="'combobox'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-combobox-control>
  <app-checkbox-control *ngSwitchCase="'checkbox'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-checkbox-control>
  <app-radio-control *ngSwitchCase="'radio'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-radio-control>
  <app-datepicker-control *ngSwitchCase="'datepicker'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-datepicker-control>
  <app-textarea-control *ngSwitchCase="'textarea'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-textarea-control>
  <app-file-control *ngSwitchCase="'file'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-file-control>
  <app-number-control *ngSwitchCase="'number'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-number-control>
  <app-password-control *ngSwitchCase="'password'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-password-control>
  <app-slider-control *ngSwitchCase="'slider'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-slider-control>
  <app-color-control *ngSwitchCase="'color'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-color-control>
  <app-time-control *ngSwitchCase="'time'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-time-control>
  <app-toggle-control *ngSwitchCase="'toggle'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-toggle-control>
  <app-rating-control *ngSwitchCase="'rating'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-rating-control>
  <app-stepper-control *ngSwitchCase="'stepper'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-stepper-control>
  <app-currency-control *ngSwitchCase="'currency'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-currency-control>
  <app-tags-control *ngSwitchCase="'tags'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-tags-control>
  <app-email-control *ngSwitchCase="'email'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-email-control>
  <app-phone-control *ngSwitchCase="'phone'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-phone-control>
  <app-url-control *ngSwitchCase="'url'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-url-control>
  <app-month-control *ngSwitchCase="'month'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-month-control>
  <app-search-control *ngSwitchCase="'search'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-search-control>
  <app-week-control *ngSwitchCase="'week'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-week-control>
  <app-datetime-control *ngSwitchCase="'datetime'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-datetime-control>
  <app-multiselect-control *ngSwitchCase="'multiselect'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-multiselect-control>
  <app-autocomplete-control *ngSwitchCase="'autocomplete'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-autocomplete-control>
  <app-button-group-control *ngSwitchCase="'button_group'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-button-group-control>
  <app-captcha-control *ngSwitchCase="'captcha'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-captcha-control>
  <app-progress-control *ngSwitchCase="'progress'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-progress-control>
  <app-markdown-control *ngSwitchCase="'markdown'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-markdown-control>
  <app-rich-text-control *ngSwitchCase="'rich_text'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-rich-text-control>
  <app-data-table-control *ngSwitchCase="'data_table'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-data-table-control>
  <app-signature-pad-control *ngSwitchCase="'signature_pad'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-signature-pad-control>
  <app-barcode-scanner-control *ngSwitchCase="'barcode'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-barcode-scanner-control>
  <app-image-control *ngSwitchCase="'image'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-image-control>
  <app-divider-control *ngSwitchCase="'divider'" [def]="componentDef"></app-divider-control>
  <app-iframe-control *ngSwitchCase="'iframe'" [def]="componentDef" [value]="value"></app-iframe-control>
  <app-video-control *ngSwitchCase="'video'" [def]="componentDef" [value]="value"></app-video-control>
  <app-audio-control *ngSwitchCase="'audio'" [def]="componentDef" [value]="value"></app-audio-control>
  <app-alert-control *ngSwitchCase="'alert'" [def]="componentDef" [value]="value"></app-alert-control>

  <fieldset *ngSwitchCase="'group'" class="border border-gray-300 p-4 rounded-md mb-4" [id]="componentDef.id">
    <legend *ngIf="componentDef.label" class="text-sm font-semibold text-gray-700 px-2">{{ componentDef.label }}</legend>
    <div class="components-container">
      <app-dynamic-field *ngFor="let child of componentDef.components" [componentDef]="child"></app-dynamic-field>
    </div>
  </fieldset>

  <div *ngSwitchCase="'accordion'" class="accordion border border-gray-300 rounded-md mb-4" [id]="componentDef.id">
    <button type="button" class="accordion-header w-full flex justify-between items-center p-4 bg-gray-50 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t-md" (click)="toggleAccordion()" [attr.aria-expanded]="isAccordionExpanded">
      <span class="text-sm font-semibold text-gray-700">{{ componentDef.label }}</span>
      <svg class="w-5 h-5 text-gray-500 transform transition-transform duration-200" [class.rotate-180]="isAccordionExpanded" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>
    <div class="accordion-content p-4" *ngIf="isAccordionExpanded" [@fadeSlideInOut]>
      <app-dynamic-field *ngFor="let child of componentDef.components" [componentDef]="child"></app-dynamic-field>
    </div>
  </div>

  <div *ngSwitchCase="'tabs'" class="tabs-container border border-gray-300 rounded-md mb-4" [id]="componentDef.id">
    <div class="tabs-header flex border-b border-gray-300 bg-gray-50 overflow-x-auto">
      <button type="button" *ngFor="let child of componentDef.components; let i = index"
              class="px-4 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 whitespace-nowrap"
              [ngClass]="{'border-b-2 border-blue-600 text-blue-600 bg-white': activeTabIndex === i, 'text-gray-600 hover:text-gray-800 hover:bg-gray-100': activeTabIndex !== i}"
              (click)="selectTab(i)"
              [attr.aria-selected]="activeTabIndex === i"
              role="tab">
        {{ child.label || 'Tab ' + (i + 1) }}
      </button>
    </div>
    <div class="tabs-content p-4" [@fadeSlideInOut]>
      <app-dynamic-field *ngIf="componentDef.components && componentDef.components[activeTabIndex]" [componentDef]="componentDef.components[activeTabIndex]"></app-dynamic-field>
    </div>
  </div>

  <div *ngSwitchCase="'carousel'" class="carousel-container relative border border-gray-300 rounded-md mb-4 group" [id]="componentDef.id">
    <div class="carousel-header p-4 border-b border-gray-300 bg-gray-50" *ngIf="componentDef.label">
      <h3 class="text-lg font-semibold text-gray-700">{{ componentDef.label }}</h3>
    </div>

    <div class="carousel-content relative overflow-hidden">
      <div #carouselScroll class="carousel-scroll flex overflow-x-auto snap-x snap-mandatory hide-scrollbar p-4 gap-4" style="scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none;">

        <ng-container *ngIf="componentDef.components && componentDef.components.length > 0; else imageCarousel">
          <div *ngFor="let child of componentDef.components" class="carousel-item snap-center shrink-0 w-full md:w-3/4 lg:w-2/3">
             <app-dynamic-field [componentDef]="child"></app-dynamic-field>
          </div>
        </ng-container>

        <ng-template #imageCarousel>
          <div *ngFor="let option of componentDef.options" class="carousel-item snap-center shrink-0 w-full md:w-3/4 lg:w-2/3 flex flex-col items-center justify-center">
            <img [src]="option.value" [alt]="option.label || 'Carousel Image'" class="max-w-full h-auto rounded shadow-md" style="max-height: 400px; object-fit: contain;">
            <p *ngIf="option.label" class="mt-2 text-sm text-gray-600 text-center">{{ option.label }}</p>
          </div>
        </ng-template>

      </div>

      <button type="button" class="carousel-prev absolute left-2 top-1/2 transform -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 p-2 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity focus:outline-none focus:ring-2 focus:ring-blue-500 z-10" (click)="scrollCarousel(-1, carouselScroll)" aria-label="Previous slide">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </button>

      <button type="button" class="carousel-next absolute right-2 top-1/2 transform -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 p-2 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity focus:outline-none focus:ring-2 focus:ring-blue-500 z-10" (click)="scrollCarousel(1, carouselScroll)" aria-label="Next slide">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </div>

  <div *ngSwitchDefault class="fallback-field">
    Unsupported component type: {{ componentDef.type }} (ID: {{ componentDef.id }})
  </div>

  <div *ngIf="componentDef.helpText" class="help-text text-sm text-gray-500 mt-1">{{ componentDef.helpText }}</div>
</div>
