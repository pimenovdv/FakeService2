<div class="dynamic-field-container" [ngSwitch]="componentDef.type" *ngIf="!isHidden">
  <app-text-input *ngSwitchCase="'text'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-text-input>
  <app-combobox-control *ngSwitchCase="'combobox'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-combobox-control>
  <app-checkbox-control *ngSwitchCase="'checkbox'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-checkbox-control>
  <app-radio-control *ngSwitchCase="'radio'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-radio-control>
  <app-datepicker-control *ngSwitchCase="'datepicker'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-datepicker-control>
  <app-textarea-control *ngSwitchCase="'textarea'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-textarea-control>
  <app-file-control *ngSwitchCase="'file'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-file-control>
  <app-number-control *ngSwitchCase="'number'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-number-control>
  <app-password-control *ngSwitchCase="'password'" [def]="componentDef" [value]="value" (valueChange)="onValueChange($event)" (isValidChange)="onValidChange($event)"></app-password-control>

  <div *ngSwitchDefault class="fallback-field">
    Unsupported component type: {{ componentDef.type }} (ID: {{ componentDef.id }})
  </div>
</div>
