<div class="control-container">
  <label [for]="def.id" class="block text-sm font-medium text-gray-700 mb-1">
    {{ def.label }}
  </label>
  <input
    type="file"
    [id]="def.id"
    [disabled]="def.disabled === true || isUploading"
    [accept]="def.accept || '*/*'"
    [multiple]="def.multiple === true"
    (change)="onFileChange($event)"
    (blur)="touched = true; validate()"
    class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
  />
  <div *ngIf="isUploading" class="text-blue-500 text-sm mt-1">
    Uploading...
  </div>
  <div *ngIf="uploadError" class="text-red-500 text-sm mt-1 error-messages">
    {{ uploadError }}
  </div>
  <div *ngIf="touched && !isValid && !isUploading" class="text-red-500 text-sm mt-1 error-messages">
    <div *ngFor="let error of errors" class="error-text">
      {{ error }}
    </div>
  </div>
</div>
