<div class="control-container">
  <label [for]="def.id" class="block text-sm font-medium text-gray-700 mb-1">
    {{ def.label }}
  </label>
  <input
    type="file"
    [id]="def.id"
    [disabled]="def.disabled === true || isUploading"
    [accept]="def.accept || '*/*'"
    [multiple]="def.multiple === true"
    (change)="onFileChange($event)"
    (blur)="touched = true; validate()"
    class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
  />
  <div *ngIf="def.multiple && value && value.length > 0 && !isUploading" class="mt-2 space-y-2">
    <div *ngFor="let file of value; let i = index"
         class="flex items-center justify-between p-2 bg-gray-50 border rounded text-sm cursor-move"
         draggable="true"
         (dragstart)="onDragStart($event, i)"
         (dragover)="onDragOver($event)"
         (drop)="onDrop($event, i)">
      <span class="truncate">{{ file.filename }}</span>
      <button type="button" (click)="removeFile(i)" class="text-red-500 hover:text-red-700 ml-2 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
  <div *ngIf="isUploading" class="mt-2 space-y-2">
    <div *ngFor="let item of uploadProgress | keyvalue" class="text-sm">
      <div class="flex justify-between mb-1">
        <span class="text-gray-700 truncate">{{ item.key }}</span>
        <span class="text-gray-500">{{ item.value }}%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div class="bg-blue-600 h-2 rounded-full" [style.width.%]="item.value"></div>
      </div>
    </div>
  </div>
  <div *ngIf="uploadError" class="text-red-500 text-sm mt-1 error-messages">
    {{ uploadError }}
  </div>
  <div *ngIf="touched && !isValid && !isUploading" class="text-red-500 text-sm mt-1 error-messages">
    <div *ngFor="let error of errors" class="error-text">
      {{ error }}
    </div>
  </div>
</div>
