<div class="iframe-control" [id]="def.id" [ngClass]="{'hidden': def.hidden}">
  <label *ngIf="def.label" class="block text-sm font-medium text-gray-700 mb-1">
    {{ def.label }}
  </label>
  <iframe
    [src]="safeUrl"
    [title]="def.altText || def.label"
    class="w-full border-0 rounded-md shadow-sm"
    style="min-height: 300px;"
    sandbox="allow-scripts allow-same-origin"
  ></iframe>
</div>
