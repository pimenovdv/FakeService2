<div class="password-control-container">
  <label [for]="def.id">{{ def.label }}</label>
  <div class="input-wrapper relative flex items-center">
    <input
      [id]="def.id"
      [type]="showPassword ? 'text' : 'password'"
      [ngModel]="value"
      [ngModelOptions]="{standalone: true}"
      (ngModelChange)="onValueChange($event)"
      [placeholder]="def.placeholder || ''"
      [disabled]="def.disabled === true"
      (blur)="touched = true; validate()"
      class="w-full pr-16"
    />
    <button *ngIf="def.clearable && value" type="button" class="clear-button absolute right-12 text-gray-500 hover:text-gray-700" (click)="clearValue()" aria-label="Clear value">
      &times;
    </button>
    <button
      type="button"
      class="toggle-visibility-btn"
      (click)="togglePasswordVisibility()"
      [disabled]="def.disabled === true"
      aria-label="Toggle password visibility"
    >
      {{ showPassword ? 'Hide' : 'Show' }}
    </button>
  </div>
  <div *ngIf="touched && !isValid" class="error-messages">
    <div *ngFor="let error of errors" class="error-text">
      {{ error }}
    </div>
  </div>
</div>
