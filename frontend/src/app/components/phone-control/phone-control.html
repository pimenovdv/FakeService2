<div class="control-container">
  <label [for]="def.id">{{ def.label }} <span *ngIf="isRequired" class="required-asterisk">*</span></label>
  <div class="input-wrapper relative flex items-center">
    <input
      type="tel"
      [id]="def.id"
      [ngModel]="value"
      (ngModelChange)="onValueChange($event)"
      [placeholder]="def.placeholder || ''"
      [disabled]="def.disabled === true"
      [ngModelOptions]="{standalone: true}"
      (blur)="touched = true; validate()"
      class="w-full"
    />
    <button *ngIf="def.clearable && value" type="button" class="clear-button absolute right-2 text-gray-500 hover:text-gray-700" (click)="clearValue()" aria-label="Clear value">
      &times;
    </button>
  </div>
  <div class="error-message" *ngIf="errors.length > 0 && touched">
    <span *ngFor="let err of errors">{{ err }}</span>
  </div>
</div>
