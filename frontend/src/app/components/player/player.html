<div *ngIf="loading" class="loading-indicator">
  Loading...
</div>

<div *ngIf="error" class="error-message">
  {{ error }}
</div>

<div *ngIf="!loading && !error && (stateService.currentScreen$ | async) as screen">

  <div class="screen-layout">
    <header class="screen-header">
      <h1>{{ screen.header }}</h1>
    </header>
    <main class="screen-content">
      <p>{{ screen.content }}</p>

      <div class="components-container">
        <app-dynamic-field *ngFor="let comp of screen.components" [componentDef]="comp"></app-dynamic-field>
      </div>

      <div class="buttons-container" *ngIf="screen.buttons && screen.buttons.length > 0">
        <button *ngFor="let button of screen.buttons"
                (click)="onAction(button)"
                [disabled]="!stateService.isScreenValid()"
                [ngClass]="'btn ' + (button.color ? 'btn-' + button.color : 'btn-primary')">
          {{ button.label }}
        </button>
      </div>
    </main>
  </div>

</div>
