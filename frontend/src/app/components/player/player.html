<div *ngIf="loading" class="loading-indicator">
  Loading...
</div>

<div *ngIf="error" class="error-message">
  {{ error }}
</div>

<div *ngIf="isFinished" class="success-message">
  Process completed successfully!
</div>

<div *ngIf="!loading && !error && !isFinished && (stateService.currentScreen$ | async) as screen">

  <div class="screen-layout">
    <div *ngIf="submitError" class="error-message submit-error">
      {{ submitError }}
    </div>

    <header class="screen-header">
      <h1>{{ screen.header }}</h1>
    </header>
    <main class="screen-content">
      <p>{{ screen.content }}</p>

      <div class="components-container">
        <app-dynamic-field *ngFor="let comp of screen.components" [componentDef]="comp"></app-dynamic-field>
      </div>
    </main>
    <footer class="screen-footer" *ngIf="screen.buttons && screen.buttons.length > 0">
      <button
        *ngFor="let btn of screen.buttons"
        [ngClass]="'btn-' + (btn.color || 'primary')"
        [disabled]="btn.action === 'next_step' && !stateService.isScreenValid()"
        (click)="onButtonClick(btn.action)"
      >
        {{ btn.label }}
      </button>
    </footer>
  </div>

</div>
