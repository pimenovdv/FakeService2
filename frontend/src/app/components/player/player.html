<div *ngIf="loading" class="loading-indicator">
  Loading...
</div>

<div *ngIf="error" class="error-message">
  {{ error }}
</div>

<div *ngIf="!loading && !error && (stateService.currentScreen$ | async) as screen">

  <div *ngIf="screen.crossValidations" id="cross-validations-data" style="display: none;">
    {{ screen.crossValidations | json }}
  </div>

  <div class="screen-layout" [ngStyle]="getThemeStyles(screen.theme)">
    <header class="screen-header flex justify-between items-center">
      <h1>{{ screen.header }}</h1>
      <button
        (click)="toggleVoiceNav()"
        [ngClass]="{'bg-red-500': isVoiceNavActive, 'bg-gray-200': !isVoiceNavActive}"
        class="p-2 rounded-full shadow-sm hover:opacity-80 transition-opacity"
        title="Toggle Voice Navigation">
        <svg *ngIf="!isVoiceNavActive" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-700">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
        </svg>
        <svg *ngIf="isVoiceNavActive" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
        </svg>
      </button>
    </header>
    <main class="screen-content">
      <p>{{ screen.content }}</p>

      <div class="components-container">
        <app-dynamic-field *ngFor="let comp of (stateService.componentDefs$ | async)" [componentDef]="comp"></app-dynamic-field>
      </div>

      <div *ngIf="validationError" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mt-4 mb-4">
        {{ validationError }}
      </div>

      <div class="flex justify-end gap-2 mt-4">
        <button *ngFor="let btn of screen.buttons"
                [ngStyle]="{'background-color': (btn.color === 'primary' || !btn.color) && screen.theme?.primaryColor ? screen.theme?.primaryColor : ''}"
                [ngClass]="{
                  'bg-blue-500 hover:bg-blue-700': (btn.color === 'primary' || !btn.color) && !screen.theme?.primaryColor,
                  'bg-gray-500 hover:bg-gray-700': btn.color === 'secondary',
                  'bg-red-500 hover:bg-red-700': btn.color === 'warn'
                }"
                class="px-4 py-2 font-semibold rounded shadow-md text-white transition-colors duration-200 ease-in-out cursor-pointer"
                (click)="onButtonClick(btn)">
          {{ btn.label }}
        </button>
      </div>
    </main>
  </div>

</div>
