<div class="control-container" [class.hidden]="def.hidden === true">
  <label [for]="def.id" class="control-label">
    {{ def.label }}
    <span *ngIf="isRequired" class="required-asterisk">*</span>
  </label>
  <div class="input-wrapper relative flex items-center">
    <input
      type="search"
      [id]="def.id"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      (blur)="validate()"
      [placeholder]="def.placeholder || ''"
      [disabled]="def.disabled === true"
      [appAutofocus]="def.autofocus"
      class="control-input"
      [class.invalid]="errors.length > 0 && touched"
      [ngModelOptions]="{standalone: true}"
    />
    <button *ngIf="def.clearable && value" type="button" class="clear-button absolute right-2 text-gray-500 hover:text-gray-700" (click)="clearValue()" aria-label="Clear value">
      &times;
    </button>
  </div>
  <div *ngIf="errors.length > 0 && touched" class="error-container">
    <div *ngFor="let err of errors" class="error-message">{{ err }}</div>
  </div>
</div>
