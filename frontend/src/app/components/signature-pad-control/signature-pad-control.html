<div class="control-container flex flex-col gap-2">
  <label *ngIf="def.label" [for]="def.id" class="text-sm font-medium text-gray-700">
    {{ def.label }}
    <span *ngIf="def.validations?.length" class="text-red-500">*</span>
  </label>

  <div class="signature-wrapper relative border border-gray-300 rounded-md overflow-hidden bg-white min-h-[200px]"
       [ngClass]="{'border-red-500': touched && !isValid}">
    <!-- The canvas will try to fill this wrapper -->
    <canvas #signatureCanvas class="w-full h-full cursor-crosshair touch-none"></canvas>

    <!-- Controls overly -->
    <div class="absolute bottom-2 right-2 flex gap-2" *ngIf="!def.disabled && !def.readonly">
      <button type="button"
              (click)="undo()"
              class="px-2 py-1 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 rounded shadow-sm border border-gray-200 transition-colors"
              title="Undo last stroke">
        Undo
      </button>
      <button type="button"
              (click)="clear()"
              class="px-2 py-1 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 rounded shadow-sm border border-gray-200 transition-colors"
              title="Clear signature">
        Clear
      </button>
    </div>
  </div>

  <div *ngIf="touched && !isValid" class="text-red-500 text-sm mt-1">
    <div *ngFor="let err of errors">{{ err }}</div>
  </div>
</div>
